<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colorfly Studio</title>
  <link rel="icon" type="image/png" href="./assets/icons/images-Photoroom.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <header>
    <nav>
      <a class="brand-link" href="#inicio">
        <img class="brand-icon" src="./assets/icons/images-Photoroom.png" alt="" />
        <h1>Colorfly Studio</h1>
      </a>

      <ul>
        <li><a href="#generador">Generador</a></li>
        <li><a href="#guardadas">Guardadas</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="inicio">
      <h2>Generador de Paletas de Colores</h2>

      <p>
        Crea paletas de colores aleatorias para tus proyectos de diseño
        seleccionando la cantidad de colores que deseas generar.
      </p>
    </section>
    <section id="generador">
      <h2>Generador de Paletas</h2>
      <div class="generator-controls">
        <div class="control-group">
          <span class="control-label">Cantidad de colores</span>

          <div class="size-options">
            <button class="size-option is-active" type="button" data-size="6">6</button>

            <button class="size-option" type="button" data-size="8">8</button>

            <button class="size-option" type="button" data-size="9">9</button>
          </div>
        </div>
        <div class="action-buttons">
          <button id="generate-btn" type="button">🎨 Generar paleta</button>

          <button id="save-palette-btn" type="button">💾</button>
        </div>
      </div>
      <div id="palette-container" class="palette-container"></div>
    </section>
    <section id="guardadas">
      <h2>Paletas Guardadas</h2>

      <div id="saved-palettes" class="palette-container saved-palettes">
      </div>
    </section>
  </main>

  <script src="./js/script.js"></script>
</body>

</html>
